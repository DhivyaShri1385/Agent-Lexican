<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | AI Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="admin">
  <div class="bg-shape bg-shape-one"></div>
  <div class="bg-shape bg-shape-two"></div>

  <main class="app-shell single-col">
    <header class="hero">
      <p class="kicker">AI-Based Image Generator</p>
      <h1>Admin Panel</h1>
      <nav class="top-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <a href="admin.html" class="active admin-only">Admin</a>
        <button id="logoutBtn" type="button">Logout</button>
      </nav>
    </header>

    <section class="panel">
      <h2>Analytics Overview</h2>
      <div id="analyticsCards" class="stats-grid"></div>
      <p id="adminStatus" class="status">Loading analytics...</p>
    </section>

    <section class="panel">
      <h2>Users</h2>
      <div class="table-wrap">
        <table class="admin-table" id="usersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>User ID</th>
              <th>Email</th>
              <th>GitHub</th>
              <th>Role</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
