<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | AI Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="settings">
  <div class="bg-shape bg-shape-one"></div>
  <div class="bg-shape bg-shape-two"></div>

  <main class="product-shell">
    <aside class="shell-sidebar">
      <div class="panel module-card">
        <h2 class="sidebar-title">Vision Studio</h2>
        <nav class="sidebar-nav" aria-label="Navigation Menu">
          <a class="module-link" href="dashboard.html">Generate</a>
          <a class="module-link" href="history.html">History</a>
          <a class="module-link" href="gallery.html">Saved Images</a>
          <a class="module-link active" href="settings.html">Settings</a>
        </nav>
        <div class="sidebar-user">
          <p id="sidebarUserText">Signed in</p>
          <div class="sidebar-user-actions">
            <a href="profile.html">Profile</a>
            <a href="admin.html" class="admin-only hidden">Admin</a>
            <button id="logoutBtn" type="button">Logout</button>
          </div>
        </div>
      </div>
    </aside>
    <section class="shell-main page-focus">
      <header class="panel shell-header"><h1>Settings</h1></header>
      <section class="panel page-panel">
        <h2>Defaults</h2>
        <form id="settingsForm">
          <div class="grid-two">
            <div>
              <label for="defaultSteps">Default Steps</label>
              <input id="defaultSteps" type="number" min="4" max="60" value="12" />
            </div>
            <div>
              <label for="defaultGuidance">Guidance scale</label>
              <input id="defaultGuidance" type="number" min="1" max="20" step="0.1" value="6.5" />
            </div>
          </div>
          <button type="submit">Save Settings</button>
        </form>
        <p class="status" id="settingsStatus">Adjust and save your defaults.</p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
